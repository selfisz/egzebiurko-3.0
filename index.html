<!DOCTYPE html>
<html lang="pl" data-theme="navy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egzebiurko 3.0</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; font-src 'none'; frame-src 'self'; worker-src 'none'; object-src 'none'; media-src 'none'; form-action 'none'; base-uri 'none';">
<style>
/* ═══════════════════════════════════════════════
   DESIGN SYSTEM — TOKENY
   ═══════════════════════════════════════════════ */
:root,[data-theme="navy"]{
  --chrome:   #1a2332;
  --chrome2:  #1a2332;
  --bg:       #f3eee7;
  --panel:    #faf6f0;
  --panel2:   #f3ebe0;
  --line:     #d8d0c5;
  --text:     #2c3e50;
  --muted:    #7f8c8d;
  --accent:   #8b3a3a;
  --accent2:  #6e2e2e;
  --soft:     #f3ebe0;
  --head:     #1a2332;
  --headText: #faf6f0;
  --zebra:    #efe8df;
  --sel:      #f0e4e0;
  --ok:       #5c6b3a;
  --danger:   #8b3a3a;
  --warn:     #9a6b2f;
  --cream:    #faf6f0;
  --paper:    #f3ebe0;
  --edge:     #d8d0c5;
  --ink-soft: #3d4a5c;
  --shadow:   0 12px 40px rgba(26,35,50,.12);
  --shadow-sm:0 2px 8px rgba(26,35,50,.08);
  --radius:   10px;
  --font:     "Segoe UI",system-ui,-apple-system,sans-serif;
  --font-display: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --mono:     Consolas,"Cascadia Mono",monospace;
  --nav-w:    280px;
  --chrome-h: 52px;
  --status-h: 36px;
}
[data-mode="dark"]{
  --bg:#12100d;--chrome:#0e0c0a;--chrome2:#0e0c0a;
  --panel:#1c1915;--panel2:#252019;--line:#3a342c;
  --text:#e8e2d8;--muted:#a89f92;--soft:#252019;
  --head:#0e0c0a;--headText:#e8e2d8;--zebra:#1c1915;
  --sel:#3a2828;--cream:#16130f;--paper:#1c1915;--edge:#3a342c;
  --ink-soft:#a89f92;--shadow:0 12px 40px rgba(0,0,0,.45);
}

/* ═══════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text)}

/* ═══════════════════════════════════════════════
   LAYOUT SHELL
   ═══════════════════════════════════════════════ */
.shell{
  display:grid;
  grid-template-rows: var(--chrome-h) 1fr var(--status-h);
  grid-template-columns: var(--nav-w) 1fr;
  grid-template-areas:
    "chrome chrome"
    "nav    content"
    "status status";
  height:100vh;
  min-height:0;
}

/* ═══════════════════════════════════════════════
   CHROME — TOP BAR
   ═══════════════════════════════════════════════ */
.chrome{
  grid-area:chrome;
  background:var(--chrome);
  display:flex;align-items:center;gap:14px;
  padding:0 16px;
  box-shadow:0 2px 16px rgba(0,0,0,.28);
  z-index:30;
  color:var(--paper);
}
.chrome-logo{
  display:flex;align-items:center;gap:12px;flex-shrink:0;
}
.chrome-mark{
  width:32px;height:32px;border-radius:8px;
  background:var(--accent);
  border:1px solid #4a1c1c;
  display:grid;place-items:center;
  font-weight:800;font-size:.82rem;color:var(--cream);
  letter-spacing:-.04em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
}
.chrome-title{
  color:var(--cream);font-size:1rem;font-weight:700;
  letter-spacing:-.02em;line-height:1.15;
}
.chrome-ver{
  color:color-mix(in srgb, var(--paper) 60%, transparent);
  font-size:.7rem;margin-top:1px;font-weight:400;line-height:1.2;
}
.chrome-actions{
  margin-left:auto;display:flex;align-items:center;gap:8px;
}
.chrome-btn{
  border:1px solid color-mix(in srgb, var(--paper) 12%, transparent);
  background:color-mix(in srgb, var(--paper) 6%, transparent);
  color:color-mix(in srgb, var(--paper) 90%, transparent);
  border-radius:8px;padding:6px 12px;
  font:inherit;font-size:.78rem;cursor:pointer;
  transition:.15s;white-space:nowrap;
}
.chrome-btn:hover{
  background:color-mix(in srgb, var(--paper) 15%, transparent);
  color:var(--cream);
}
.chrome-btn.active{background:var(--accent);color:var(--cream);border-color:transparent}
.offline-pill{
  font-size:.68rem;padding:4px 10px;border-radius:999px;
  border:1px solid color-mix(in srgb, var(--paper) 22%, transparent);
  color:var(--paper);
  background:color-mix(in srgb, var(--paper) 10%, transparent);
  letter-spacing:.02em;
}

/* ═══════════════════════════════════════════════
   NAV — LEFT SIDEBAR
   ═══════════════════════════════════════════════ */
.nav{
  grid-area:nav;
  background:var(--chrome);
  display:flex;flex-direction:column;
  overflow:hidden;z-index:20;
  border-right:1px solid color-mix(in srgb, var(--paper) 10%, transparent);
}
.nav-section{padding:12px 12px 4px;font-size:.65rem;font-weight:700;
  color:color-mix(in srgb, var(--paper) 50%, transparent);
  letter-spacing:.12em;text-transform:uppercase;
}
.nav-btn{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  border:1px solid transparent;
  border-left:4px solid transparent;
  background:transparent;
  color:color-mix(in srgb, var(--paper) 72%, transparent);
  font:inherit;font-size:.85rem;
  cursor:pointer;border-radius:0 999px 999px 0;margin:1px 16px 1px 0;
  transition:.15s;text-align:left;
}
.nav-btn:hover{
  background:color-mix(in srgb, var(--paper) 8%, transparent);
  color:var(--cream);
}
.nav-btn.active{
  background:color-mix(in srgb, var(--paper) 12%, transparent);
  color:#fff;
  font-weight:650;
  border-left-color:var(--accent);
  box-shadow:none;
}
.nav-btn.active .nav-icon{color:#fff;opacity:1}
.nav-btn.is-open:not(.active){
  border-left-color:color-mix(in srgb, var(--accent) 70%, transparent);
  color:color-mix(in srgb, var(--paper) 88%, transparent);
}
.nav-btn.is-open .nav-label::after{
  content:'';
  display:inline-block;
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);margin-left:8px;vertical-align:middle;
  opacity:.9;
}
.nav-icon{font-size:1.1rem;width:22px;text-align:center;flex-shrink:0}
.nav-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-badge{
  font-size:.65rem;font-weight:700;
  padding:2px 7px;border-radius:999px;
  background:color-mix(in srgb, var(--accent) 35%, transparent);
  color:var(--cream);
  flex-shrink:0;
}
.nav-spacer{flex:1}
.nav-bottom{
  padding:10px 0;border-top:1px solid color-mix(in srgb, var(--paper) 10%, transparent);
}
.nav-bottom .nav-btn{margin:1px 16px 1px 0}

/* ═══════════════════════════════════════════════
   CONTENT AREA
   ═══════════════════════════════════════════════ */
.content-area{
  grid-area:content;
  overflow:hidden;
  display:flex;flex-direction:column;
  min-height:0;
  background:var(--bg);
  width:100%;
  position:relative;
}
.workspace-tabs{
  display:flex;align-items:flex-end;gap:4px;
  flex-shrink:0;
  align-self:stretch;
  width:100%;
  box-sizing:border-box;
  padding:10px 16px 0;
  min-height:48px;
  background:color-mix(in srgb, var(--chrome) 5%, var(--bg));
  border-bottom:1px solid var(--edge);
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:thin;
}
.workspace-tabs.empty{display:none}
.ws-tab{
  position:relative;
  display:inline-flex;align-items:center;gap:8px;
  max-width:220px;
  padding:8px 14px 10px;
  margin-bottom:-1px;
  border:1px solid var(--edge);
  border-bottom:none;
  border-radius:10px 10px 0 0;
  background:color-mix(in srgb, var(--cream) 55%, transparent);
  color:var(--muted);
  font-family:var(--font);
  font-size:.82rem;font-weight:550;
  cursor:pointer;white-space:nowrap;
  transition:background .15s, color .15s, border-color .15s, box-shadow .15s;
}
.ws-tab:hover{
  background:var(--cream);
  color:var(--text);
}
.ws-tab.active{
  background:var(--cream);
  color:var(--text);
  border-color:var(--edge);
  font-weight:650;
  box-shadow:0 1px 3px rgba(26,35,50,.06);
  z-index:2;
}
[data-mode="dark"] .workspace-tabs{
  background:color-mix(in srgb, var(--panel) 80%, #000);
}
[data-mode="dark"] .ws-tab{
  background:color-mix(in srgb, var(--panel2) 70%, transparent);
  color:var(--muted);
  border-color:var(--edge);
}
[data-mode="dark"] .ws-tab.active{
  background:var(--panel);
  color:var(--text);
  border-color:var(--edge);
  box-shadow:none;
}
.ws-tab-label{overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.ws-tab-x{
  flex-shrink:0;
  width:20px;height:20px;line-height:18px;
  border-radius:6px;
  text-align:center;
  font-size:15px;opacity:.45;color:var(--muted);
  transition:opacity .12s, background .12s, color .12s;
}
.ws-tab-x:hover{opacity:1;background:rgba(139,58,58,.12);color:var(--accent)}
.ws-tab.active .ws-tab-x{opacity:.65;color:var(--accent)}
.ws-tab.active .ws-tab-x:hover{
  opacity:1;background:rgba(139,58,58,.14);color:var(--accent2);
}
.workspace-ctx{
  position:fixed;z-index:9999;display:none;
  min-width:210px;padding:6px;
  background:var(--cream);color:var(--chrome);
  border:1px solid var(--edge);
  border-radius:12px;
  box-shadow:0 14px 36px rgba(26,35,50,.22);
  font-family:var(--font);
  font-size:.82rem;
}
.workspace-ctx.open{display:block}
.workspace-ctx-h{
  padding:6px 10px 8px;font-size:.68rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);
  font-family:var(--font-display);
}
.workspace-ctx button{
  display:block;width:100%;text-align:left;
  border:none;background:transparent;color:inherit;
  font:inherit;padding:8px 10px;border-radius:8px;cursor:pointer;
}
.workspace-ctx button:hover{background:color-mix(in srgb, var(--paper) 80%, #fff)}
.workspace-ctx button.danger{color:var(--accent)}
.workspace-ctx-sep{height:1px;background:var(--edge);margin:4px 2px}

/* ═══════════════════════════════════════════════
   NARZĘDZIA — wspólna szata (Szafka: papier + atrament)
   ═══════════════════════════════════════════════ */
#panel-zakladka1,
#panel-zakladka2,
#panel-zakladka3,
#panel-zakladka4{
  --tool-ink:#1a2332;
  --tool-ink-soft:#3d4a5c;
  --tool-paper:#f3ebe0;
  --tool-paper2:#ebe1d4;
  --tool-cream:#faf6f0;
  --tool-spine:#8b3a3a;
  --tool-spine-active:#6e2e2e;
  --tool-olive:#5c6b3a;
  --tool-edge:#d4c4b0;
  --tool-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --tool-ui:"Segoe UI",system-ui,-apple-system,sans-serif;
  --tool-excel:#3d6b4f;
  --tool-ok:#5c6b3a;
  --tool-err:#8b3a3a;
  --tool-warn:#9a6b2f;
  background:
    radial-gradient(ellipse 100% 70% at 8% 0%, rgba(139,58,58,.07), transparent 55%),
    linear-gradient(180deg, #e8dfd2 0%, var(--tool-paper) 42%, #e4d9cb 100%);
  color:var(--tool-ink);
  font-family:var(--tool-ui);
}
[data-mode="dark"] #panel-zakladka1,
[data-mode="dark"] #panel-zakladka2,
[data-mode="dark"] #panel-zakladka3,
[data-mode="dark"] #panel-zakladka4{
  --tool-ink:#e8e2d8;
  --tool-ink-soft:#a89f92;
  --tool-paper:#1c1915;
  --tool-paper2:#252019;
  --tool-cream:#16130f;
  --tool-spine:#9a4a4a;
  --tool-spine-active:#c46a6a;
  --tool-olive:#8fa06a;
  --tool-edge:#3a342c;
  --tool-excel:#6a9a78;
  --tool-ok:#8fa06a;
  --tool-err:#c46a6a;
  --tool-warn:#c4a06a;
  background:
    radial-gradient(ellipse 100% 70% at 8% 0%, rgba(154,74,74,.12), transparent 55%),
    linear-gradient(180deg, #14110e 0%, var(--tool-paper) 50%, #12100d 100%);
}
.module-panel{
  flex:1;min-height:0;overflow:hidden;
  display:flex;flex-direction:column;
}
.module-panel.hidden{display:none!important}
/* iframe Arkusza nie może dostać display:none — przeglądarka go wtedy przeładowuje i pyta o autosave */
#panel-arkusz.hidden{
  display:flex!important;
  position:absolute; inset:0;
  visibility:hidden; pointer-events:none;
  z-index:-1; width:auto; height:auto;
}
.empty-tab-placeholder{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;color:var(--muted);user-select:none;
}
.empty-tab-title{font-size:1.15rem;font-weight:700;color:var(--text)}
.empty-tab-hint{font-size:.85rem}

/* ═══════════════════════════════════════════════
   NAVIGATION CONTEXT MENU
   ═══════════════════════════════════════════════ */
.nav-context-menu{
  position:fixed;z-index:9999;display:none;min-width:200px;max-width:280px;
  background:var(--cream);color:var(--text);border:1px solid var(--edge);
  border-radius:10px;box-shadow:0 12px 32px rgba(26,35,50,.18);padding:6px;
}
.nav-context-menu.open{display:block}
.nav-ctx-header{
  font-size:.7rem;color:var(--muted);padding:4px 10px 6px;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;max-width:260px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.nav-context-menu button{
  width:100%;text-align:left;border:0;background:transparent;color:var(--text);
  padding:8px 10px;border-radius:8px;font:inherit;font-size:.82rem;cursor:pointer;
}
.nav-context-menu button:hover{background:color-mix(in srgb, var(--paper) 80%, #fff)}
.nav-context-menu button.danger{color:var(--accent)}
.nav-ctx-sep{height:1px;background:var(--edge);margin:4px 0}

/* ═══════════════════════════════════════════════
   GLOBAL STATUS BAR
   ═══════════════════════════════════════════════ */
.global-status{
  grid-area:status;
  background:var(--panel);
  border-top:1px solid var(--line);
  display:flex;align-items:center;gap:0;
  padding:0 16px;
  font-size:.75rem;z-index:25;
  overflow:hidden;
}
.sb-item{display:flex;align-items:center;gap:5px;color:var(--muted)}
.sb-item strong{color:var(--text)}
.sb-icon{font-size:.85rem}
.sb-sep{color:var(--line);margin:0 10px;font-size:1.2rem}

/* ═══════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════ */
.app-toast{
  position:fixed;right:18px;bottom:52px;
  background:var(--chrome);color:#fff;
  padding:10px 16px;border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
  font-size:.84rem;z-index:999;
  opacity:0;transform:translateY(8px);
  transition:.22s ease;
  max-width:min(380px,90vw);
}
.app-toast.show{opacity:1;transform:none}
.app-toast.toast-success{background:var(--ok)}
.app-toast.toast-error  {background:var(--accent)}
.app-toast.toast-warn   {background:var(--warn)}

/* ═══════════════════════════════════════════════
   OGNIVO MODULE
   ═══════════════════════════════════════════════ */
.ognivo-wrap{max-width:1400px;margin:0 auto;padding:28px 24px;min-height:0}
.ognivo-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;gap:16px}
.mod-title{
  font-size:1.5rem;font-weight:700;color:var(--text);margin-bottom:4px;
  font-family:var(--font-display);letter-spacing:-.02em;
}
.mod-sub{color:var(--muted);font-size:.88rem}
.ognivo-stored-badge{
  background:color-mix(in srgb,var(--accent) 12%,var(--soft));
  border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));
  color:var(--accent);font-size:.8rem;font-weight:600;
  padding:8px 14px;border-radius:8px;white-space:nowrap;
}
.ognivo-dropzone{
  background:var(--panel);border:2px dashed var(--line);
  border-radius:14px;padding:36px 20px;text-align:center;
  color:var(--muted);transition:.2s;box-shadow:var(--shadow-sm);
  margin-bottom:20px;
}
.ognivo-dropzone.drag-over{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.dz-icon{font-size:2.4rem;margin-bottom:10px}
.dz-text{font-size:1rem;font-weight:600;margin-bottom:6px;color:var(--text)}
.dz-sub{font-size:.84rem;margin-bottom:18px}
.dz-btns{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.btn-dz{
  border:1px solid var(--line);background:var(--panel2);color:var(--text);
  padding:9px 18px;border-radius:8px;cursor:pointer;font:inherit;font-size:.85rem;
  transition:.15s;
}
.btn-dz:hover{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.ognivo-actions{background:var(--panel);border-radius:12px;padding:16px 20px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.ognivo-queue-info{font-size:1.05rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.ognivo-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn-act{
  border:none;padding:9px 18px;font:inherit;font-size:.85rem;font-weight:600;
  border-radius:8px;cursor:pointer;transition:.15s;display:inline-flex;
  align-items:center;gap:6px;
}
.btn-start{background:var(--accent);color:#fff}.btn-start:hover{background:var(--accent2)}
.btn-clear{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}.btn-clear:hover{background:#fee2e2;color:var(--danger)}
.btn-export{background:#0f766e;color:#fff}.btn-export:hover{background:#0d6360}
.btn-secondary{background:var(--soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line))}.btn-secondary:hover{background:var(--sel)}
.ognivo-progress{margin-top:14px}
.prog-bar-wrap{background:var(--line);border-radius:6px;height:8px;overflow:hidden;margin-bottom:6px}
.prog-bar{height:100%;width:0;background:var(--ok);border-radius:6px;transition:width .2s ease-out}
.prog-text{font-size:.8rem;color:var(--muted)}
.results-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px;background:var(--panel2);border-radius:10px 10px 0 0;
  border:1px solid var(--line);border-bottom:none;
  font-size:.85rem;
}
.results-hint{color:var(--muted);font-size:.78rem}
.ognivo-table-wrap{overflow:auto;border-radius:0 0 10px 10px;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.ognivo-table{width:100%;border-collapse:collapse;background:var(--panel);font-size:.84rem}
.ognivo-table th{
  background:var(--head);color:var(--headText);
  padding:12px 16px;text-align:left;
  font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;
  cursor:pointer;user-select:none;white-space:nowrap;
}
.ognivo-table th:hover{background:color-mix(in srgb,var(--head) 85%,var(--accent))}
.ognivo-table td{padding:12px 16px;border-bottom:1px solid var(--line)}
.ognivo-table tr:last-child td{border-bottom:none}
.ognivo-table tr:hover td{background:var(--zebra)}
.ognivo-table .center{text-align:center}
.td-name{font-weight:600;color:var(--text)}
.td-id{font-family:var(--mono);color:var(--muted)}
.td-muted{color:var(--muted);font-size:.8rem}
.hit-count{font-size:1.05rem;font-weight:700;color:var(--accent)}
.bank-badge{
  display:inline-block;background:var(--soft);
  color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));
  padding:3px 10px;border-radius:6px;font-size:.78rem;font-weight:500;
  margin:2px 2px;
}
.bank-unknown{background:#fff5f5;color:var(--danger);border-color:#fecdd3}
.banks-wrap{display:flex;flex-wrap:wrap;gap:2px}
.in-arkusz{color:var(--ok);font-size:1rem}
.not-arkusz{color:var(--muted)}
.stored-results{margin-top:28px}
.stored-title{font-size:1rem;font-weight:700;margin-bottom:12px;color:var(--text)}

/* ═══════════════════════════════════════════════
   WRO MODULE
   ═══════════════════════════════════════════════ */
.wro-layout{display:flex;flex:1;min-height:0;overflow:hidden}
.wro-sidebar{
  width:360px;flex-shrink:0;background:var(--chrome2);
  display:flex;flex-direction:column;overflow:hidden;
}
.wro-sidebar-inner{
  padding:14px;display:flex;flex-direction:column;
  gap:10px;border-bottom:1px solid rgba(255,255,255,.08);
  flex-shrink:0;
}
.wro-cart-btn{
  background:var(--warn);color:#fff;
  border:none;padding:11px 14px;border-radius:8px;
  font:inherit;font-weight:700;font-size:.88rem;
  cursor:pointer;transition:.15s;text-align:left;
  display:flex;align-items:center;justify-content:space-between;
}
.wro-cart-btn:hover{background:color-mix(in srgb,var(--warn) 85%,#000)}
.wro-cart-counter{
  background:rgba(0,0,0,.25);border-radius:999px;
  padding:2px 9px;font-size:.78rem;
}
.wro-upload-btn{
  display:block;background:var(--accent);color:#fff;
  padding:10px 14px;border-radius:8px;
  cursor:pointer;font-size:.85rem;font-weight:600;
  text-align:center;transition:.15s;
}
.wro-upload-btn:hover{background:var(--accent2)}
.wro-progress-row{display:flex;gap:8px}
.wro-prog-btn{
  flex:1;background:rgba(255,255,255,.08);color:#c5d8f0;
  border:1px solid rgba(255,255,255,.1);border-radius:7px;
  padding:8px 10px;font:inherit;font-size:.78rem;
  cursor:pointer;transition:.15s;text-align:center;display:block;
}
.wro-prog-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.wro-search{
  width:100%;padding:9px 12px;border-radius:7px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.06);color:#e7eef8;
  font:inherit;font-size:.85rem;outline:none;
}
.wro-search::placeholder{color:#4a6480}
.wro-search:focus{border-color:var(--accent);background:rgba(255,255,255,.09)}
.wro-filters{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.wro-chip{
  background:rgba(255,255,255,.07);color:#8ba7c5;
  border:1px solid rgba(255,255,255,.08);
  padding:5px 10px;border-radius:12px;
  font-size:.74rem;cursor:pointer;transition:.15s;
  user-select:none;
}
.wro-chip:hover{background:rgba(255,255,255,.12);color:#d0e4f5}
.wro-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:650}
.wro-list{flex:1;overflow-y:auto;min-height:0}
.wro-list::-webkit-scrollbar{width:6px}
.wro-list::-webkit-scrollbar-thumb{background:#374151;border-radius:3px}
.wro-empty-list{padding:24px;color:#4a6480;font-size:.85rem;text-align:center;line-height:1.5}
.wro-list-item{
  padding:12px 16px;cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.04);
  transition:.15s;
}
.wro-list-item:hover{background:rgba(255,255,255,.05)}
.wro-list-item.active{background:color-mix(in srgb, var(--accent) 14%, transparent);border-left:3px solid var(--accent);padding-left:13px}
.wro-list-item.is-analyzed{opacity:.45}.wro-list-item.is-analyzed:hover{opacity:.8}
.wro-list-item.is-analyzed.active{opacity:1;background:rgba(30,58,138,.35)}
.wro-list-title{font-size:.85rem;font-weight:600;color:#d0e4f5;display:flex;justify-content:space-between;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;gap:6px;align-items:center}
.wro-list-title span:first-child{overflow:hidden;text-overflow:ellipsis}
.wro-list-item.is-stub{opacity:.92}
.wro-stub-chip{
  display:inline-block; margin-left:6px; font-size:.62rem; font-weight:700; letter-spacing:.03em;
  text-transform:uppercase; padding:2px 6px; border-radius:999px; vertical-align:middle;
  background:#334155; color:#cbd5e1; white-space:nowrap;
}
.wro-stub-chip.ark{background:#3f6212; color:#ecfccb}
.wro-entity-title .wro-stub-chip{margin:4px 6px 0 0}
.wro-list-score{font-size:.75rem;color:#4a6480;margin-top:5px;display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.wro-icon-jump{cursor:pointer;padding:2px 5px;border-radius:4px;transition:.15s;background:rgba(255,255,255,.04)}
.wro-icon-jump:hover{background:rgba(255,255,255,.15);transform:scale(1.15)}
.wro-content{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.wro-empty-state{flex:1;display:flex;align-items:center;justify-content:center;padding:40px}
.wro-empty-card{max-width:400px;text-align:center;padding:32px;border:1px dashed var(--line);border-radius:16px;background:var(--panel)}
.wro-empty-icon{font-size:2.8rem;margin-bottom:12px}
.wro-empty-card h3{font-size:1.1rem;margin-bottom:8px;color:var(--text)}
.wro-empty-card p{font-size:.87rem;color:var(--muted);line-height:1.5}
.wro-db-info{color:var(--ok);font-weight:600;margin-top:8px}
.wro-entity-wrap{padding:24px 28px;max-width:1400px}
.wro-entity-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:14px;flex-wrap:wrap}
.wro-entity-title{font-size:1.25rem;font-weight:700;color:var(--text)}
.wro-meta-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.wro-meta-badge{
  font-size:.82rem;color:#1e40af;background:var(--soft);
  padding:6px 12px;border-radius:7px;border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));
  cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:5px;
}
.wro-meta-badge:hover{background:var(--sel);transform:translateY(-1px)}
.wro-ognivo-badge{
  display:inline-block;margin-top:8px;
  background:color-mix(in srgb,var(--ok) 12%,var(--soft));
  border:1px solid color-mix(in srgb,var(--ok) 30%,var(--line));
  color:var(--ok);padding:5px 12px;border-radius:7px;
  font-size:.82rem;font-weight:600;
}
.wro-source-chip{font-size:.8rem;color:var(--muted);background:var(--panel2);padding:4px 10px;border-radius:12px;margin-top:6px;display:inline-block}
.wro-entity-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.wro-btn{
  border:none;padding:9px 16px;font:inherit;font-size:.82rem;font-weight:600;
  border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap;
}
.wro-btn-orange{background:var(--warn);color:#fff}.wro-btn-orange:hover{background:#b45309}
.wro-btn-red{background:var(--danger);color:#fff}.wro-btn-red:hover{background:#9f1239}
.wro-btn-green{background:var(--ok);color:#fff}.wro-btn-green:hover{background:#0d6360}
.wro-btn-arkusz{background:var(--soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line))}.wro-btn-arkusz:hover{background:var(--sel)}
.wro-sticky-nav{
  position:sticky;top:0;background:var(--bg);z-index:10;
  padding:12px 0;border-bottom:1px solid var(--line);
  margin-bottom:20px;
}
.wro-sticky-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.wro-capsules{display:flex;flex-wrap:wrap;gap:8px}
.wro-capsule{
  background:var(--panel);border:1px solid var(--line);
  padding:6px 12px;border-radius:16px;font-size:.8rem;
  color:var(--text);cursor:pointer;text-decoration:none;
  font-weight:500;transition:.15s;
}
.wro-capsule:hover{background:var(--chrome);color:#fff;border-color:var(--chrome)}
.wro-capsule-action{
  background:#fee2e2;border-color:var(--danger);color:#991b1b;font-weight:700;
  animation:pulse 2s infinite;
}
.wro-capsule-action:hover{background:#fca5a5}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(190,18,60,.4)}70%{box-shadow:0 0 0 7px rgba(190,18,60,0)}100%{box-shadow:0 0 0 0 rgba(190,18,60,0)}}
.wro-analyze-btn{
  background:var(--accent);color:#fff;padding:9px 18px;
  border-radius:20px;border:none;cursor:pointer;
  font:inherit;font-weight:600;font-size:.82rem;transition:.15s;
}
.wro-analyze-btn:hover{background:var(--accent2)}
.wro-analyze-btn.done{background:var(--muted)}
.wro-toggle-row{display:flex;gap:8px;border-top:1px dashed var(--line);padding-top:8px}
.wro-toggle-btn{
  background:transparent;border:1px solid var(--line);
  color:var(--muted);padding:4px 10px;border-radius:5px;
  font:inherit;font-size:.75rem;cursor:pointer;transition:.15s;
}
.wro-toggle-btn:hover{background:var(--panel2);color:var(--text)}
.wro-ognivo-inline{
  background:color-mix(in srgb,var(--ok) 8%,var(--panel));
  border:1px solid color-mix(in srgb,var(--ok) 25%,var(--line));
  border-radius:10px;padding:14px 16px;margin-bottom:20px;
}
.wro-ognivo-title{font-size:.85rem;font-weight:700;color:var(--ok);margin-bottom:8px}
.wro-ognivo-banks{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.wro-ognivo-meta{font-size:.75rem;color:var(--muted)}
.wro-source-block{margin-bottom:24px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wro-source-title{
  font-size:.9rem;font-weight:700;color:#1e40af;
  background:var(--panel2);padding:12px 16px;
  display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;transition:.15s;user-select:none;
}
.wro-source-title:hover{background:var(--soft)}
.wro-action-block .wro-source-title{color:var(--danger);background:#fff5f5}
.wro-action-block .wro-source-title:hover{background:#fee2e2}
.wro-collapse-icon{transition:transform .25s;font-size:.75rem;color:var(--muted)}
.wro-source-block.collapsed .wro-collapse-icon{transform:rotate(-90deg)}
.wro-source-block.collapsed .wro-cards-grid{display:none}
.wro-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding:16px;background:var(--panel)}
.wro-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow-sm)}
.wro-card-hdr{background:var(--panel2);padding:7px 14px;font-size:.75rem;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}
.wro-card-row{display:flex;border-bottom:1px solid #f1f5f9;padding:7px 14px}
.wro-card-row:last-child{border-bottom:none}
.wro-label{width:42%;flex-shrink:0;font-size:.78rem;font-weight:600;color:var(--muted)}
.wro-value{font-size:.82rem;color:var(--text);word-break:break-word}
.wro-empty-val{color:var(--line)}
.wro-matrix-table{width:100%;border-collapse:collapse;font-size:.82rem;background:var(--panel)}
.wro-matrix-table th{background:var(--head);color:var(--headText);padding:10px 12px;font-size:.72rem;text-transform:uppercase;white-space:nowrap;position:sticky;top:0}
.wro-matrix-table td{padding:9px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;vertical-align:middle}
.wro-name-col{text-align:left!important;font-weight:600;background:var(--panel2)!important}
.wro-matrix-id{color:var(--muted);font-size:.78rem;font-family:var(--mono)}
.matrix-v{color:var(--ok);font-weight:900;font-size:1rem}
.matrix-x{color:var(--danger);font-weight:900;font-size:1rem}
.wro-matrix-table tr:hover td{background:var(--zebra)}
.wro-title-left{display:flex;align-items:center;gap:8px}

/* ═══════════════════════════════════════════════
   ZOBOWIĄZANI — Szafka teczek (kartoteka)
   ═══════════════════════════════════════════════ */
#panel-zobowiazani{
  --zob-ink: #1a2332;
  --zob-ink-soft: #3d4a5c;
  --zob-paper: #f3ebe0;
  --zob-paper2: #ebe1d4;
  --zob-cream: #faf6f0;
  --zob-spine: #8b3a3a;
  --zob-spine-active: #6e2e2e;
  --zob-olive: #5c6b3a;
  --zob-edge: #d4c4b0;
  --zob-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --zob-ui: "Segoe UI", system-ui, -apple-system, sans-serif;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(139,58,58,.06), transparent 45%),
    linear-gradient(180deg, #e8dfd2 0%, var(--zob-paper) 40%, #e4d9cb 100%);
  font-family: var(--zob-ui);
}
[data-mode="dark"] #panel-zobowiazani{
  --zob-ink: #e8e2d8;
  --zob-ink-soft: #a89f92;
  --zob-paper: #1c1915;
  --zob-paper2: #252019;
  --zob-cream: #16130f;
  --zob-spine: #9a4a4a;
  --zob-spine-active: #c46a6a;
  --zob-olive: #8fa06a;
  --zob-edge: #3a342c;
  background: linear-gradient(180deg, #14110e 0%, #1a1612 100%);
}

.zob-wrap{
  width:100%; height:100%; min-height:0; box-sizing:border-box;
  padding:16px 18px; display:flex; flex-direction:column; gap:12px;
  color: var(--zob-ink);
}
.zob-header{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-shrink:0; flex-wrap:wrap}
.zob-title-area{display:flex; flex-direction:column; gap:2px}
.zob-title-area .mod-title,
.zob-mod-title{
  margin:0; font-family:var(--zob-display); font-size:1.45rem; font-weight:700;
  letter-spacing:-.02em; color:var(--zob-ink); line-height:1.15;
}
.zob-mod-sub{margin:0; font-size:.82rem; color:var(--zob-ink-soft)}
.zob-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.zob-action-btn{
  height:34px; padding:0 14px; border-radius:8px; font:inherit; font-size:.8rem; font-weight:600;
  cursor:pointer; border:1px solid var(--zob-edge); background:var(--zob-cream); color:var(--zob-ink);
  transition: background .15s, border-color .15s, transform .12s;
}
.zob-action-btn:hover{background:#fff; border-color:var(--zob-spine)}
.zob-action-btn.primary{background:var(--zob-spine); color:#faf6f0; border-color:transparent}
.zob-action-btn.primary:hover{background:var(--zob-spine-active)}
.zob-action-btn.olive{background:var(--zob-olive); color:#faf6f0; border-color:transparent}
.zob-action-btn.is-on{
  background:color-mix(in srgb, var(--zob-spine) 14%, var(--zob-cream));
  border-color:var(--zob-spine); color:var(--zob-spine);
}

.zob-toolbar{
  display:flex; flex-direction:column; gap:10px; flex-shrink:0;
  background: color-mix(in srgb, var(--zob-cream) 88%, transparent);
  border:1px solid var(--zob-edge); border-radius:12px; padding:10px 14px;
  backdrop-filter: blur(6px);
  transition: padding .15s, gap .15s, border-color .15s, background .15s;
}
.zob-toolbar.filters-collapsed{
  padding:6px 10px; gap:0;
  background:transparent; border-color:transparent; backdrop-filter:none;
}
.zob-toolbar.filters-collapsed .zob-pills{display:none}
.zob-toolbar.filters-collapsed .zob-tool-top{gap:8px}
.zob-toolbar.filters-collapsed .zob-search{
  padding:7px 12px 7px 34px; font-size:.82rem;
}
.zob-toolbar.filters-collapsed .zob-stats{font-size:.72rem; opacity:.85}
.zob-tool-top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.zob-search-box{position:relative; display:flex; align-items:center; flex:1; min-width:240px}
.zob-search-box svg{position:absolute; left:12px; color:var(--zob-ink-soft); pointer-events:none}
.zob-search{
  width:100%; padding:9px 14px 9px 36px; border-radius:8px;
  border:1px solid var(--zob-edge); font:inherit; font-size:.88rem;
  background:var(--zob-cream); color:var(--zob-ink); outline:none; transition:.2s;
}
.zob-search:focus{border-color:var(--zob-spine); box-shadow:0 0 0 3px rgba(139,58,58,.15)}
.zob-stats{font-size:.78rem; color:var(--zob-ink-soft); white-space:nowrap}
.zob-stats strong{color:var(--zob-ink)}
.zob-pills{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.zob-pill{
  border:1px solid var(--zob-edge); background:var(--zob-cream); color:var(--zob-ink-soft);
  font:inherit; font-size:.76rem; font-weight:600; padding:5px 11px; border-radius:999px;
  cursor:pointer; transition:.15s; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.zob-pill:hover{background:#fff; color:var(--zob-ink); border-color:var(--zob-spine)}
.zob-pill.active{background:var(--zob-ink); color:var(--zob-cream); border-color:var(--zob-ink)}
.zob-pill.pill-warn.active{background:#9a6b2f; border-color:#9a6b2f}
.zob-pill.pill-ok.active{background:var(--zob-olive); border-color:var(--zob-olive)}
.zob-pill.pill-danger.active{background:var(--zob-spine); border-color:var(--zob-spine)}
.zob-pill-count{opacity:.85; font-size:.7rem; padding:1px 6px; border-radius:10px; background:rgba(0,0,0,.12)}
.zob-pill.active .zob-pill-count{background:rgba(255,255,255,.22)}
.zob-pill-sep{color:var(--zob-edge); margin:0 2px}

/* Split: lista jak Arkusz + otwarta teczka */
.zob-split-container{flex:1; min-height:0; display:flex; gap:14px; overflow:hidden}
.zob-split-container.mode-list .zob-drawer{width:100%; max-width:none; flex:1}
.zob-split-container.mode-list .zob-folder-open{display:none}
.zob-split-container.mode-split .zob-drawer{width:min(300px, 34%); flex-shrink:0}
.zob-split-container.mode-focus{
  justify-content:center;
  background:
    radial-gradient(ellipse 80% 60% at 50% 40%, rgba(26,35,50,.06), transparent 70%),
    color-mix(in srgb, var(--zob-paper2) 45%, var(--zob-cream));
  border-radius:14px;
  padding:10px 12px;
}
.zob-split-container.mode-focus .zob-drawer{display:none}
.zob-split-container.mode-focus .zob-folder-open{
  flex:0 1 auto;
  width:min(920px, 100%);
  max-width:920px;
  box-shadow: 0 18px 48px rgba(26,35,50,.16), inset 0 1px 0 rgba(255,255,255,.65);
}

.zob-chrome{
  display:flex; flex-direction:column; gap:8px; flex-shrink:0; margin-bottom:4px;
  width:100%;
}
.zob-sections{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.zob-section-btn{
  font:inherit; font-size:.8rem; font-weight:700; cursor:pointer;
  border:1px solid var(--zob-edge); background:var(--zob-cream); color:var(--zob-ink-soft);
  border-radius:10px; padding:7px 12px; display:inline-flex; align-items:center; gap:8px;
  transition: background .12s, color .12s, border-color .12s;
}
.zob-section-btn:hover{color:var(--zob-ink); border-color:var(--zob-spine)}
.zob-section-btn.active{
  color:#fff; background:var(--zob-ink); border-color:var(--zob-ink);
}
.zob-section-count{
  font-size:.68rem; font-weight:700; opacity:.75;
  background:rgba(255,255,255,.14); padding:1px 7px; border-radius:999px;
}
.zob-section-btn:not(.active) .zob-section-count{
  background:color-mix(in srgb, var(--zob-paper2) 80%, #fff); color:var(--zob-ink-soft);
}

.zob-browser-tabs{
  display:flex; gap:4px; flex-wrap:wrap; align-items:flex-end; min-height:40px;
  width:100%; box-sizing:border-box; align-self:stretch;
  padding:6px 0 0; margin:0;
  border:none; border-bottom:1px solid var(--zob-edge); border-radius:0;
  background:transparent;
}
.zob-tabs-empty{font-size:.72rem; color:var(--zob-ink-soft); padding:4px 8px}
.zob-btab{
  font:inherit; font-size:.76rem; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; gap:8px; max-width:220px; min-width:96px;
  border:1px solid transparent; border-bottom:none; background:transparent; color:var(--zob-ink-soft);
  border-radius:8px 8px 0 0; padding:7px 8px 8px 12px; margin-bottom:-1px;
}
.zob-btab:hover{background:rgba(255,255,255,.55); color:var(--zob-ink)}
.zob-btab.active{
  background:var(--zob-cream); color:var(--zob-ink); border-color:var(--zob-edge);
  box-shadow:0 1px 3px rgba(26,35,50,.06);
}
.zob-btab-label{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; text-align:left; min-width:0}
.zob-btab-x{
  flex-shrink:0; margin-left:auto;
  width:18px; height:18px; border-radius:4px; display:inline-flex; align-items:center; justify-content:center;
  font-size:14px; line-height:1; opacity:.55;
}
.zob-btab-x:hover{opacity:1; background:rgba(154,60,60,.12); color:var(--zob-spine)}

.zob-open-header{
  padding:18px 18px 10px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
  border-bottom:1px solid var(--zob-edge); flex-shrink:0;
  animation: zobFolderIn .28s ease;
}
.zob-open-header-main{min-width:0; flex:1}
.zob-open-ids{
  display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px;
  margin-top:6px;
}
.zob-open-addr{
  font:inherit; font-size:.82rem; color:var(--zob-ink-soft);
  background:transparent; border:0; padding:0; cursor:pointer; text-align:left;
  max-width:min(420px, 100%); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.zob-open-addr:hover{color:var(--zob-spine); text-decoration:underline}
.zob-open-sub{margin-top:6px; font-size:.78rem; color:var(--zob-ink-soft); display:flex; flex-wrap:wrap; align-items:center; gap:6px}
.zob-id-chip{
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--mono); font-size:.78rem; font-weight:650;
  color:var(--zob-spine); background:color-mix(in srgb, var(--zob-paper) 70%, var(--zob-cream));
  border:1px solid var(--zob-edge); border-radius:7px; padding:4px 9px;
  cursor:pointer; transition: background .12s, border-color .12s;
}
.zob-id-chip:hover{background:#fff; border-color:var(--zob-spine); text-decoration:none}
.zob-id-chip .lbl{
  font-family:var(--zob-ui); font-size:.62rem; font-weight:700;
  text-transform:uppercase; letter-spacing:.06em; color:var(--zob-ink-soft);
}
.zob-open-header-actions{
  display:flex; align-items:center; gap:6px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end;
}
.zob-win-controls{
  display:inline-flex; gap:3px; align-items:center;
  margin-left:4px; padding-left:8px; border-left:1px solid var(--zob-edge);
}
.zob-win-btn{
  font:inherit; font-size:.78rem; font-weight:700; cursor:pointer;
  min-width:28px; height:28px; padding:0 8px; border-radius:6px;
  border:1px solid var(--zob-edge); background:var(--zob-paper); color:var(--zob-ink);
}
.zob-win-btn:hover{border-color:var(--zob-spine); background:#fff}
.zob-win-btn.close:hover{background:rgba(154,60,60,.12); color:var(--zob-spine); border-color:color-mix(in srgb, var(--zob-spine) 40%, var(--zob-edge))}
.zob-win-btn.archive{color:var(--zob-spine)}
.zob-pin-btn{
  font:inherit; font-size:.78rem; cursor:pointer; border:1px solid transparent;
  background:transparent; border-radius:6px; padding:2px 6px; line-height:1.2;
}
.zob-pin-btn:hover,.zob-pin-btn.on{background:color-mix(in srgb, var(--zob-spine) 10%, transparent)}
.zob-reg-addr{font-size:.76rem; color:var(--zob-ink-soft); max-width:220px; display:inline-block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.zob-muted{color:var(--zob-ink-soft); opacity:.65}
.zob-reg-table.zob-reg-full .zob-reg-name{max-width:240px}

.zob-open-footer{
  padding:10px 16px; border-top:1px solid var(--zob-edge);
  background:color-mix(in srgb, var(--zob-paper2) 70%, var(--zob-cream));
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; flex-shrink:0;
}
.zob-open-footer .zob-nav-btn:first-child{justify-self:start}
.zob-open-footer .zob-nav-btn:last-child{justify-self:end}
.zob-open-footer .zob-foot-count{
  justify-self:center; font-size:.78rem; color:var(--zob-ink-soft); font-weight:600;
  font-variant-numeric:tabular-nums;
}

.zob-ctx{
  position:fixed; z-index:80; min-width:200px; max-width:min(280px,92vw);
  background:var(--zob-cream); color:var(--zob-ink);
  border:1px solid var(--zob-edge); border-radius:10px;
  box-shadow:0 12px 32px rgba(26,35,50,.18); padding:6px; display:none;
}
.zob-ctx.open{display:block}
.zob-ctx .zob-ctx-h{
  font-size:.7rem; color:var(--zob-ink-soft); padding:4px 10px 6px; font-weight:700;
  text-transform:uppercase; letter-spacing:.04em;
  max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.zob-ctx button{
  width:100%; text-align:left; border:0; background:transparent; color:var(--zob-ink);
  padding:8px 10px; border-radius:8px; font:inherit; font-size:.82rem; cursor:pointer;
}
.zob-ctx button:hover{background:color-mix(in srgb, var(--zob-paper2) 80%, #fff)}
.zob-ctx button.danger{color:var(--zob-spine)}
.zob-ctx .zob-ctx-sep{height:1px; background:var(--zob-edge); margin:4px 0}

.zob-drawer{
  width:min(520px, 52%); flex-shrink:0; display:flex; flex-direction:column;
  background: var(--zob-cream);
  border:1px solid var(--zob-edge); border-radius:14px; overflow:hidden;
  box-shadow: 0 8px 24px rgba(26,35,50,.08);
}
.zob-drawer.compact{
  width:min(300px, 34%);
  min-width:240px;
}
.zob-drawer.compact .zob-folder-scroll{
  overflow-x:hidden;
  overflow-y:auto;
}
.zob-person-list-head{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:8px 12px; position:sticky; top:0; z-index:2;
  background:var(--zob-ink); color:var(--zob-cream);
  border-bottom:2px solid var(--zob-spine);
}
.zob-person-sort{
  font:inherit; font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  border:0; background:transparent; color:inherit; cursor:pointer; padding:0;
}
.zob-person-sort.is-sorted{color:#f0d6c8}
.zob-person-list{display:flex; flex-direction:column}
.zob-person-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; box-sizing:border-box; text-align:left;
  padding:9px 12px; border:0; border-bottom:1px solid var(--zob-edge);
  background:transparent; color:var(--zob-ink); cursor:pointer; font:inherit;
}
.zob-person-row:nth-child(even){background:color-mix(in srgb, var(--zob-paper) 55%, transparent)}
.zob-person-row:hover{background:color-mix(in srgb, var(--zob-paper2) 80%, #fff)}
.zob-person-row.is-selected{
  background:color-mix(in srgb, var(--zob-spine) 12%, var(--zob-cream)) !important;
  box-shadow: inset 4px 0 0 var(--zob-spine);
}
.zob-person-main{min-width:0; flex:1}
.zob-person-row .zob-reg-name{
  max-width:none; width:100%;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  font-size:.88rem;
}
.zob-person-row .zob-systems-dots{
  display:inline-flex; gap:3px; align-items:center; margin-top:4px;
}
.zob-person-row .zob-systems-dots .zob-dot{
  width:7px; height:7px; border-radius:50%; display:inline-block; flex-shrink:0;
  background:transparent; border:1.5px solid color-mix(in srgb, var(--zob-ink-soft) 50%, transparent);
}
.zob-person-row .zob-systems-dots .zob-dot.on{background:var(--zob-olive); border-color:var(--zob-olive)}
.zob-person-row .zob-systems-dots .zob-dot.skip{background:var(--zob-edge); border-color:var(--zob-edge)}
.zob-person-row .zob-systems-count{
  font-size:.65rem; font-weight:700; color:var(--zob-ink-soft); margin-left:5px;
}
.zob-person-row .zob-status-chip{flex-shrink:0}
.zob-drawer-head{
  padding:10px 14px; color:var(--zob-ink-soft); font-size:.68rem; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; border-bottom:1px solid var(--zob-edge);
  background: color-mix(in srgb, var(--zob-paper2) 70%, var(--zob-cream));
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.zob-drawer-head-title{color:var(--zob-ink)}
.zob-drawer-count{
  font-variant-numeric:tabular-nums; font-size:.72rem; font-weight:700;
  color:var(--zob-ink-soft); background:color-mix(in srgb, var(--zob-paper) 70%, #fff);
  border:1px solid var(--zob-edge); border-radius:999px; padding:2px 8px; letter-spacing:0;
  text-transform:none;
}
.zob-folder-scroll{flex:1; overflow:auto; min-height:0}
.zob-folder-empty{
  padding:28px 16px; text-align:center; color:var(--zob-ink-soft); font-size:.85rem; line-height:1.4;
}

/* Lista-kalka z Arkusza (wiersze jeden pod drugim) */
.zob-reg-table{width:100%; border-collapse:separate; border-spacing:0; font-size:.8rem}
.zob-reg-table thead th{
  position:sticky; top:0; z-index:2;
  background:var(--zob-ink); color:var(--zob-cream);
  font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  padding:9px 10px; text-align:left; white-space:nowrap; cursor:pointer; user-select:none;
  border-bottom:2px solid var(--zob-spine);
}
.zob-reg-table thead th:hover{background:color-mix(in srgb, var(--zob-ink) 85%, var(--zob-spine))}
.zob-reg-table thead th.is-sorted{color:#f0d6c8}
.zob-reg-table thead th .sort-ind{opacity:.55; margin-left:4px; font-size:.65rem}
.zob-reg-table tbody tr{
  cursor:pointer; transition: background .12s;
}
.zob-reg-table tbody tr:nth-child(even) td{background:color-mix(in srgb, var(--zob-paper) 55%, transparent)}
.zob-reg-table tbody tr:hover td{background:color-mix(in srgb, var(--zob-paper2) 80%, #fff)}
.zob-reg-table tbody tr.is-selected td{
  background:color-mix(in srgb, var(--zob-spine) 12%, var(--zob-cream)) !important;
}
.zob-reg-table tbody tr.is-selected td:first-child{
  box-shadow: inset 3px 0 0 var(--zob-spine);
}
.zob-reg-table td{
  padding:8px 10px; border-bottom:1px solid var(--zob-edge);
  vertical-align:middle; color:var(--zob-ink);
}
.zob-reg-name{
  font-family:var(--zob-display); font-weight:700; font-size:.9rem; line-height:1.2;
  max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.zob-reg-ids{font-family:var(--mono); font-size:.7rem; color:var(--zob-ink-soft); margin-top:2px}
.zob-reg-table.zob-reg-compact thead th{padding:8px 12px; font-size:.66rem}
.zob-reg-table.zob-reg-compact td{padding:9px 12px}
.zob-reg-table.zob-reg-compact .zob-reg-name{max-width:none; font-size:.92rem}
.zob-reg-table.zob-reg-compact .zob-reg-ids{margin-top:3px}
.zob-reg-table.zob-reg-compact tbody tr.is-selected td:first-child{
  box-shadow: inset 4px 0 0 var(--zob-spine);
}
.zob-reg-sys{display:inline-flex; gap:3px; align-items:center}
.zob-reg-sys .zob-dot{width:8px; height:8px}
.zob-reg-sys-count{font-size:.68rem; font-weight:700; color:var(--zob-ink-soft); margin-left:4px}
.zob-dot{
  width:7px; height:7px; border-radius:50%; display:inline-block;
  background: transparent; border:1.5px solid color-mix(in srgb, var(--zob-ink-soft) 50%, transparent);
}
.zob-dot.on{background:var(--zob-olive); border-color:var(--zob-olive)}
.zob-dot.skip{background:var(--zob-edge); border-color:var(--zob-edge)}
.zob-status-chip{
  font-size:.65rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  padding:2px 7px; border-radius:999px; white-space:nowrap;
}
.zob-status-chip.todo{background:rgba(139,58,58,.12); color:var(--zob-spine)}
.zob-status-chip.progress{background:rgba(154,107,47,.15); color:#7a5524}
.zob-status-chip.complete{background:rgba(92,107,58,.16); color:var(--zob-olive)}
.zob-defer-chip{
  display:inline-block; margin-top:4px; font-size:.65rem; font-weight:700;
  padding:2px 7px; border-radius:999px; letter-spacing:.02em;
}
.zob-defer-chip.wait{background:rgba(61,90,128,.12); color:#3d5a80}
.zob-defer-chip.due{background:rgba(154,107,47,.18); color:#7a5524}
.zob-defer-banner{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 14px; border-radius:10px; font-size:.84rem; font-weight:600;
  border:1px solid var(--zob-edge);
}
.zob-defer-banner.wait{background:rgba(61,90,128,.08); color:#3d5a80}
.zob-defer-banner.due{background:rgba(154,107,47,.14); color:#7a5524}
.zob-defer-actions{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.zob-defer-note{font-size:.72rem; color:var(--zob-ink-soft); margin:0; line-height:1.35}
.zob-defer-pop{
  position:fixed; z-index:90; min-width:220px; max-width:min(300px,92vw);
  background:var(--zob-cream); color:var(--zob-ink);
  border:1px solid var(--zob-edge); border-radius:12px;
  box-shadow:0 14px 36px rgba(26,35,50,.2); padding:10px;
}
.zob-defer-pop .zob-defer-pop-h{
  font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  color:var(--zob-ink-soft); margin:0 0 8px; padding:0 2px;
}
.zob-defer-pop .zob-defer-actions{flex-direction:column; align-items:stretch}
.zob-defer-pop .zob-action-btn{justify-content:flex-start; text-align:left; height:34px}

/* Otwarta teczka */
.zob-folder-open{
  flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;
  background:var(--zob-cream);
  border:1px solid var(--zob-edge); border-radius:14px;
  box-shadow: 0 14px 40px rgba(26,35,50,.12), inset 0 1px 0 rgba(255,255,255,.65);
  position:relative;
}
.zob-folder-open.collapsed{display:none}
.zob-folder-open::before{
  content:""; position:absolute; top:0; left:0; right:0; height:8px;
  background: linear-gradient(180deg, var(--zob-spine), color-mix(in srgb, var(--zob-spine) 70%, #000));
  border-radius:13px 13px 0 0; opacity:.95; pointer-events:none; z-index:1;
}
#zob-detail-content{flex:1; display:flex; flex-direction:column; min-height:0; padding-top:2px}

.zob-open-title{
  font-family:var(--zob-display); font-size:1.45rem; font-weight:700;
  color:var(--zob-ink); line-height:1.15; letter-spacing:-.02em;
}
.zob-open-tabs{
  display:flex; gap:2px; padding:0 14px; flex-shrink:0;
  border-bottom:1px solid var(--zob-edge); background:color-mix(in srgb, var(--zob-paper2) 55%, transparent);
}
.zob-tab{
  font:inherit; font-size:.8rem; font-weight:600; color:var(--zob-ink-soft);
  background:transparent; border:none; border-bottom:2px solid transparent;
  padding:10px 12px; cursor:pointer; transition: color .15s, border-color .15s;
}
.zob-tab:hover{color:var(--zob-ink)}
.zob-tab.active{color:var(--zob-spine); border-bottom-color:var(--zob-spine)}
.zob-open-body{
  flex:1; overflow-y:auto; padding:12px 18px 16px; display:flex; flex-direction:column; gap:12px; min-height:0;
  animation: zobTabFade .22s ease;
}
.zob-section{
  display:flex; flex-direction:column; gap:8px;
  padding-bottom:10px;
  border-bottom:1px solid var(--zob-edge);
}
.zob-section:last-child{border-bottom:none; padding-bottom:0}
.zob-section-title{
  font-size:.66rem; font-weight:750; text-transform:uppercase; letter-spacing:.08em;
  color:var(--zob-ink-soft); display:flex; justify-content:space-between; align-items:center;
  gap:8px;
}
.zob-section-hint{font-weight:550; letter-spacing:.02em; text-transform:none; font-size:.7rem; opacity:.85}
.zob-sheet{
  background:var(--zob-paper); border:1px solid var(--zob-edge); border-radius:10px;
  padding:12px 14px; display:flex; flex-direction:column; gap:8px;
  box-shadow: 0 1px 0 rgba(255,255,255,.5) inset;
}
.zob-sheet-title{
  font-size:.7rem; font-weight:750; text-transform:uppercase; letter-spacing:.08em;
  color:var(--zob-ink-soft); display:flex; justify-content:space-between; align-items:center;
}
.zob-id-row{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:5px 0; border-bottom:1px dotted color-mix(in srgb, var(--zob-edge) 80%, transparent);
}
.zob-id-row:last-child{border-bottom:none; padding-bottom:0}
.zob-id-label{font-size:.68rem; color:var(--zob-ink-soft); font-weight:650; text-transform:uppercase; letter-spacing:.04em}
.zob-badge-mono{
  font-family:var(--mono); background:transparent; color:var(--zob-spine);
  border:none; padding:0; border-radius:0; font-weight:650; cursor:pointer; font-size:.8rem;
}
.zob-badge-mono:hover{background:transparent; text-decoration:underline}

.zob-systems-grid{
  display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:6px;
}
@media (max-width:900px){
  .zob-systems-grid{grid-template-columns:repeat(3, minmax(0, 1fr))}
}
@media (max-width:560px){
  .zob-systems-grid{grid-template-columns:1fr 1fr}
}
.zob-sys-tile{
  border:1px solid var(--zob-edge); border-radius:8px;
  background:color-mix(in srgb, var(--zob-paper) 55%, var(--zob-cream));
  padding:8px 9px; display:flex; flex-direction:column; gap:3px; cursor:pointer; transition:.15s;
  min-width:0;
}
.zob-sys-tile:hover{border-color:var(--zob-spine); background:#fff}
.zob-sys-tile.done{border-color:color-mix(in srgb, var(--zob-olive) 55%, var(--zob-edge)); background:color-mix(in srgb, var(--zob-olive) 12%, var(--zob-cream))}
.zob-sys-tile-name{font-size:.74rem; font-weight:700; color:var(--zob-ink); display:flex; justify-content:space-between; gap:4px}
.zob-sys-tile-val{font-size:.68rem; color:var(--zob-ink-soft); font-family:var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.zob-sys-tile.done .zob-sys-tile-val{color:var(--zob-olive); font-weight:600}

.zob-kv-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; font-size:.8rem}
.zob-kv-item{display:flex; flex-direction:column; gap:1px; padding:4px 0}
.zob-kv-item.full{grid-column:1 / -1}
.zob-kv-label{font-size:.64rem; color:var(--zob-ink-soft); font-weight:650; text-transform:uppercase; letter-spacing:.04em}
.zob-kv-val{font-weight:500; color:var(--zob-ink); word-break:break-word; cursor:pointer}
.zob-kv-val:hover{text-decoration:underline}

.zob-note-area{
  width:100%; min-height:140px; resize:vertical; box-sizing:border-box;
  padding:12px 14px; border-radius:8px; border:1px solid var(--zob-edge);
  background:var(--zob-cream); color:var(--zob-ink); font:inherit; font-size:.88rem; line-height:1.45;
}
.zob-note-area:focus{outline:none; border-color:var(--zob-spine); box-shadow:0 0 0 3px rgba(139,58,58,.12)}

.zob-person-row.has-car{
  box-shadow: inset 3px 0 0 #5a7a4a;
}
.zob-person-row.has-car.is-selected{
  box-shadow: inset 4px 0 0 var(--zob-spine);
}
.zob-car-mark{margin-right:5px; font-size:.92em}
.zob-reg-table tbody tr.has-car td:first-child{
  box-shadow: inset 3px 0 0 #5a7a4a;
}
.zob-status-chip.suspended{background:rgba(122,85,36,.16); color:#7a5524}

.zob-vehicle{
  background:var(--zob-cream); border:1px solid var(--zob-edge); border-radius:8px;
  padding:10px 12px; display:flex; flex-direction:column; gap:0; cursor:pointer;
  transition: border-color .15s, box-shadow .15s;
}
.zob-vehicle:hover{border-color:var(--zob-spine); box-shadow:0 0 0 3px rgba(139,58,58,.08)}
.zob-vehicle-sum{display:flex; justify-content:space-between; align-items:center; gap:10px}
.zob-vehicle-brand{font-weight:700; color:var(--zob-ink)}
.zob-vehicle-meta{font-size:.72rem; color:var(--zob-ink-soft); margin-top:2px}
.zob-vehicle-full{display:none; margin-top:10px}
.zob-vehicle.open .zob-vehicle-full{display:block}
.zob-vehicle .wro-card{
  margin:0; border:1px solid var(--zob-edge); border-radius:8px; overflow:hidden; background:#fff;
}

.zob-nav-btn{
  background:var(--zob-cream); border:1px solid var(--zob-edge); color:var(--zob-ink);
  font:inherit; font-size:.8rem; font-weight:600; padding:7px 12px; border-radius:7px; cursor:pointer; transition:.15s;
}
.zob-nav-btn:hover{background:#fff; border-color:var(--zob-spine)}
.zob-nav-btn.accent{background:rgba(139,58,58,.1); color:var(--zob-spine); border-color:color-mix(in srgb, var(--zob-spine) 35%, var(--zob-edge))}
.zob-btn-komplet{
  background:var(--zob-olive); color:#faf6f0; border:none; font:inherit; font-size:.78rem; font-weight:700;
  padding:7px 12px; border-radius:7px; cursor:pointer;
}
.zob-btn-komplet:hover{filter:brightness(1.05)}

@keyframes zobFolderIn{
  from{opacity:0; transform:translateY(6px)}
  to{opacity:1; transform:none}
}
@keyframes zobTabFade{
  from{opacity:0; transform:translateY(4px)}
  to{opacity:1; transform:none}
}

@media(max-width:1100px){
  .zob-drawer{width:min(420px, 48%)}
  .zob-open-title{font-size:1.3rem}
}
@media(max-width:820px){
  .zob-split-container{flex-direction:column}
  .zob-drawer{width:100%; max-height:42%}
}

/* ═══════════════════════════════════════════════
   ARKUSZ — integration bar + iframe wrapper
   ═══════════════════════════════════════════════ */
#panel-arkusz{display:flex;flex-direction:column;overflow:hidden}
#arkusz-content-area{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#arkusz-frame{flex:1;width:100%;border:none;min-height:0;display:block}

/* Pasek integracji nad Arkuszem */
.arkusz-integration-bar{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  padding:7px 14px;
  background:linear-gradient(90deg,var(--chrome2),color-mix(in srgb,var(--chrome2) 85%,var(--accent)));
  border-bottom:1px solid rgba(255,255,255,.07);
  flex-shrink:0;
  min-height:40px;
}
.aib-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.aib-badge{
  font-size:.75rem;padding:4px 10px;border-radius:6px;
  background:rgba(255,255,255,.07);color:#8ba7c5;
  border:1px solid rgba(255,255,255,.08);white-space:nowrap;
}
.aib-badge.aib-active{background:color-mix(in srgb, var(--accent) 28%, transparent);color:#f0d6c8;border-color:color-mix(in srgb, var(--accent) 45%, transparent)}
.aib-badge.aib-ok{background:rgba(15,118,110,.25);color:#5eead4;border-color:rgba(15,118,110,.4)}
.aib-badge.aib-warn{background:rgba(217,119,6,.25);color:#fcd34d;border-color:rgba(217,119,6,.4)}
.aib-actions{display:flex;gap:6px;flex-wrap:wrap}
.aib-btn{
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.07);
  color:#c5d8f0;border-radius:7px;padding:5px 11px;
  font:inherit;font-size:.76rem;cursor:pointer;transition:.15s;white-space:nowrap;
}
.aib-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.aib-btn.aib-sync{border-color:color-mix(in srgb, var(--accent) 45%, transparent);color:#f0d6c8}
.aib-btn.aib-sync:hover{background:color-mix(in srgb, var(--accent) 22%, transparent)}

/* Fallback */
.arkusz-link-btn{
  border:1px solid var(--line);background:var(--panel2);color:var(--text);
  padding:6px 12px;border-radius:7px;font:inherit;font-size:.78rem;cursor:pointer;transition:.15s;
}
.arkusz-link-btn:hover{background:var(--soft);border-color:var(--accent);color:var(--accent)}

/* ═══════════════════════════════════════════════
   SCROLLBARS
   ═══════════════════════════════════════════════ */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.wro-list::-webkit-scrollbar-thumb{background:#374151}

/* ═══════════════════════════════════════════════
   RESPONSYWNOŚĆ
   ═══════════════════════════════════════════════ */
@media(max-width:900px){
  .shell{grid-template-columns:1fr;grid-template-areas:"chrome""content""status";grid-template-rows:var(--chrome-h) 1fr var(--status-h)}
  .nav{display:none}
}
</style>
</head>

<body>
<div class="shell">

  <!-- ═══ CHROME ══════════════════════════════════ -->
  <header class="chrome">
    <div class="chrome-logo">
      <div class="chrome-mark">E3</div>
      <div>
        <div class="chrome-title">Egzebiurko</div>
        <div class="chrome-ver">3.0 · offline · wszystko w jednym miejscu</div>
      </div>
    </div>
    <div class="chrome-actions">
      <span class="offline-pill">🔒 Offline · sandbox</span>
      <button class="chrome-btn" id="btn-egze-save" title="Zapisz całe Egzebiurko (Arkusz + Szafka + WRO/OGNIVO) do jednego pliku JSON">Zapisz wszystko</button>
      <button class="chrome-btn" id="btn-egze-load" title="Wczytaj pakiet .egze.json albo pojedynczy skoroszyt Arkusza">Wczytaj wszystko</button>
      <input type="file" id="egze-bundle-file" accept=".json,.egze.json,application/json" hidden>
      <button class="chrome-btn" id="btn-dark" title="Tryb jasny / ciemny" onclick="toggleDark()">◐</button>
    </div>
  </header>

  <!-- ═══ NAV ═════════════════════════════════════ -->
  <nav class="nav">
    <div class="nav-section">Główne</div>
    <button class="nav-btn active" data-module="arkusz" onclick="handleNavClick(event, 'arkusz')" oncontextmenu="showNavMenu(event, 'arkusz')">
      <span class="nav-icon">📋</span>
      <span class="nav-label">Arkusz</span>
      <span class="nav-badge" id="nav-badge-arkusz" style="display:none"></span>
    </button>
    <button class="nav-btn" data-module="zobowiazani" onclick="handleNavClick(event, 'zobowiazani')" oncontextmenu="showNavMenu(event, 'zobowiazani')">
      <span class="nav-icon">▦</span>
      <span class="nav-label">Szafka teczek</span>
    </button>
    <button class="nav-btn" data-module="wro" onclick="handleNavClick(event, 'wro')" oncontextmenu="showNavMenu(event, 'wro')">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Analityka WRO</span>
      <span class="nav-badge" id="nav-badge-wro" style="display:none"></span>
    </button>

    <div class="nav-section">Narzędzia</div>
    <button class="nav-btn" data-module="ognivo" onclick="handleNavClick(event, 'ognivo')" oncontextmenu="showNavMenu(event, 'ognivo')">
      <span class="nav-icon">🏦</span>
      <span class="nav-label">OGNIVO</span>
      <span class="nav-badge" id="nav-badge-ognivo" style="display:none"></span>
    </button>
    <button class="nav-btn" data-module="zakladka1" onclick="handleNavClick(event, 'zakladka1')" oncontextmenu="showNavMenu(event, 'zakladka1')">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Wklepywator Excel</span>
    </button>
    <button class="nav-btn" data-module="zakladka2" onclick="handleNavClick(event, 'zakladka2')" oncontextmenu="showNavMenu(event, 'zakladka2')">
      <span class="nav-icon">🧮</span>
      <span class="nav-label">Rozliczenia</span>
    </button>
    <button class="nav-btn" data-module="zakladka3" onclick="handleNavClick(event, 'zakladka3')" oncontextmenu="showNavMenu(event, 'zakladka3')">
      <span class="nav-icon">🖨️</span>
      <span class="nav-label">Druk przelewu</span>
    </button>
    <button class="nav-btn" data-module="zakladka4" onclick="handleNavClick(event, 'zakladka4')" oncontextmenu="showNavMenu(event, 'zakladka4')">
      <span class="nav-icon">⚖️</span>
      <span class="nav-label">Balanser</span>
    </button>

    <div class="nav-spacer"></div>
    <div class="nav-bottom">
      <div class="nav-section" style="padding-top:0">Ustawienia</div>
      <button class="nav-btn" onclick="toggleDark()">
        <span class="nav-icon">◐</span>
        <span class="nav-label">Tryb ciemny</span>
      </button>
    </div>
  </nav>

  <!-- ═══ CONTENT ══════════════════════════════════ -->
  <div class="content-area">
    <div id="workspace-tabs" class="workspace-tabs empty" aria-label="Otwarte zakładki"></div>

    <!-- ARKUSZ PANEL -->
    <div class="module-panel" id="panel-arkusz">
      <div id="arkusz-content-area" style="flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden">
        <!-- Moduł arkusz.js renderuje tu iframe + pasek integracji -->
      </div>
    </div>

    <!-- ZOBOWIAZANI PANEL -->
    <div class="module-panel hidden" id="panel-zobowiazani">
      <div id="zobowiazani-app" style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden"></div>
    </div>

    <!-- OGNIVO PANEL -->
    <div class="module-panel hidden" id="panel-ognivo">
      <div id="ognivo-app" style="flex:1;min-height:0;overflow-y:auto;overflow-x:hidden"></div>
    </div>

    <!-- WRO PANEL -->
    <div class="module-panel hidden" id="panel-wro">
      <div id="wro-app" style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden"></div>
    </div>

    <!-- PLACEHOLDER PANELS -->
    <div class="module-panel hidden" id="panel-zakladka1">
      <div id="akumulator-app"></div>
    </div>
    <div class="module-panel hidden" id="panel-zakladka2">
      <div id="rozliczenia-app"></div>
    </div>
    <div class="module-panel hidden" id="panel-zakladka3">
      <div id="przelew-app"></div>
    </div>
    <div class="module-panel hidden" id="panel-zakladka4">
      <div id="balanser-app"></div>
    </div>

  </div>

  <!-- ═══ STATUS BAR ═══════════════════════════════ -->
  <div class="global-status">
    <div id="global-statusbar">
      <span class="sb-item"><span class="sb-icon">📋</span> <strong>0</strong> spraw</span>
      <span class="sb-sep">·</span>
      <span class="sb-item"><span class="sb-icon">🏦</span> <strong>0</strong> wyników OGNIVO</span>
      <span class="sb-sep">·</span>
      <span class="sb-item"><span class="sb-icon">🛒</span> <strong>0</strong> w koszyku WRO</span>
    </div>
  </div>

</div>

<!-- TOAST -->
<div class="app-toast" id="app-toast"></div>

<!-- ═══ ARKUSZ HTML WBUDOWANY ════════════════════ -->
<div id="arkusz-hidden-source" style="display:none"></div>

<script src="app.js"></script>
<script src="nav-context.js"></script>
<script src="zobowiazani.js"></script>
<script src="ognivo.js"></script>
<script src="wro.js"></script>
<script src="rozliczenia.js"></script>
<script src="przelew.js"></script>
<script src="akumulator.js"></script>
<script src="balanser.js"></script>
<script src="arkusz.js"></script>

<script>
/* ─── INIT ──────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  StatusBar.init();
  if (window.EgzeBundle) EgzeBundle.bindUi();
  Router.register('ognivo', OgnivoModule);
  Router.register('wro', WroModule);
  Router.register('arkusz', ArkuszModule);
  Router.register('zobowiazani', ZobowiazaniModule);
  Router.register('zakladka1', AkumulatorModule);
  Router.register('zakladka2', RozliczeniaModule);
  Router.register('zakladka3', PrzelewModule);
  Router.register('zakladka4', BalanserModule);

  // Aktualizuj badges w nav
  SharedStore.on('*', updateNavBadges);
  updateNavBadges();

  WorkspaceTabs.init();

  // Załaduj ostatni widok lub Arkusz
  const last = localStorage.getItem('egze3_last_module') || 'arkusz';
  Router.navigate(last);
});

function updateNavBadges() {
  const ognivo = SharedStore.get(SharedStore.KEYS.OGNIVO, {});
  const cart   = SharedStore.get(SharedStore.KEYS.WRO_CART, []);

  const ob = document.getElementById('nav-badge-ognivo');
  const wb = document.getElementById('nav-badge-wro');

  const oc = Object.keys(ognivo).length;
  const wc = cart.length;

  if (ob) { ob.textContent = oc; ob.style.display = oc > 0 ? 'inline' : 'none'; }
  if (wb) { wb.textContent = wc; wb.style.display = wc > 0 ? 'inline' : 'none'; }
}

/* ─── DARK MODE ─────────────────────────────────── */
function toggleDark() {
  const curr = document.documentElement.getAttribute('data-mode');
  document.documentElement.setAttribute('data-mode', curr === 'dark' ? '' : 'dark');
  try { localStorage.setItem('egze3_dark', curr === 'dark' ? '0' : '1'); } catch {}
}
(function(){
  try { if (localStorage.getItem('egze3_dark') === '1') document.documentElement.setAttribute('data-mode','dark'); } catch {}
})();

/* ─── CROSS-MODUŁ PRZEJŚCIA z Arkusza ──────────── */
function goToOgnivoFromArkusz() {
  const id = ArkuszModule.getSelectedId?.();
  if (id) Router.navigate('ognivo', { pesel: id });
  else {
    Router.navigate('ognivo');
    showToast('ℹ️ Zaznacz wiersz w Arkuszu aby przejść z kontekstem osoby', 'info');
  }
}

function goToWroFromArkusz() {
  const id = ArkuszModule.getSelectedId?.();
  if (id) Router.navigate('wro', { pesel: id });
  else {
    Router.navigate('wro');
    showToast('ℹ️ Zaznacz wiersz w Arkuszu aby przejść z kontekstem osoby', 'info');
  }
}

function reloadArkusz() {
  ArkuszModule.activate({});
}
</script>
</body>
</html>
